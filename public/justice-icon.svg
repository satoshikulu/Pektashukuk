<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8941f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0a" rx="64"/>
  
  <!-- Justice Scale -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Center Column -->
    <rect x="-8" y="-120" width="16" height="240" fill="url(#goldGradient)"/>
    
    <!-- Top Triangle -->
    <path d="M -30 -120 L 30 -120 L 0 -160 Z" fill="url(#goldGradient)"/>
    
    <!-- Left Scale -->
    <g transform="translate(-80, -60)">
      <circle cx="0" cy="0" r="4" fill="url(#goldGradient)"/>
      <path d="M -40 0 L 40 0" stroke="url(#goldGradient)" stroke-width="4" fill="none"/>
      <path d="M -40 0 L -35 -20 L 35 -20 L 40 0" fill="url(#goldGradient)" opacity="0.8"/>
      <path d="M -40 0 L -35 20 L 35 20 L 40 0" fill="url(#goldGradient)" opacity="0.8"/>
    </g>
    
    <!-- Right Scale -->
    <g transform="translate(80, -60)">
      <circle cx="0" cy="0" r="4" fill="url(#goldGradient)"/>
      <path d="M -40 0 L 40 0" stroke="url(#goldGradient)" stroke-width="4" fill="none"/>
      <path d="M -40 0 L -35 -20 L 35 -20 L 40 0" fill="url(#goldGradient)" opacity="0.8"/>
      <path d="M -40 0 L -35 20 L 35 20 L 40 0" fill="url(#goldGradient)" opacity="0.8"/>
    </g>
    
    <!-- Base -->
    <ellipse cx="0" cy="120" rx="60" ry="15" fill="url(#goldGradient)" opacity="0.6"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#d4af37" text-anchor="middle">HP</text>
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="16" fill="#b8941f" text-anchor="middle">HUKUK</text>
</svg>
